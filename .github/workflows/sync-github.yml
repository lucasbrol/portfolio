name: Sincronizar projetos do GitHub

# Uma vez por dia, pede um novo deploy à Vercel. O deploy roda `npm run build`,
# que reconstrói a base do assistente com os repositórios e READMEs mais recentes.
on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy na Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Configure o secret VERCEL_DEPLOY_HOOK"; exit 1; fi
          curl -fsS -X POST "$HOOK"
